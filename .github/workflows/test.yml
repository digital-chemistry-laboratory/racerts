name: Tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run ruff
        run: |
          python -m pip install ruff
          ruff check src tests
          ruff format --check src tests

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up conda (RDKit)
        uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: racerts-ci
          auto-activate-base: false
          python-version: "3.11"
          channels: conda-forge
          channel-priority: strict

      - name: Install RDKit with conda
        run: conda install -y rdkit

      - name: Install package, ASE and YAML dependencies, and pytest
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[ase,yaml]" pytest

      - name: Run default pytest suite
        run: pytest

      - name: Run ASE-marked tests
        run: pytest -m ase

  baseline:
    # The byte-identity references of tests/test_baseline.py were written with RDKit
    # 2025.03.2 (Python 3.10, numpy 2.2) and skip on any other version.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install RDKit 2025.03.2, the package and pytest
        run: |
          python -m pip install --upgrade pip
          pip install "rdkit==2025.3.2" -e ".[ase,yaml]" pytest

      - name: Run the baseline tests
        run: pytest tests/test_baseline.py -m "ase or not ase"
