site_name: "racerTS documentation"
site_description: Rapid Conformer Ensembles with RDKit for Transition States
copyright: "Copyright © 2025 ETH Zürich"
site_dir: site
strict: false
use_directory_urls: true

docs_dir: docs

theme:
  name: readthedocs
  logo: img/logo.png
  favicon: img/favicon.ico
  features:
    - search.highlight
    - content.code.copy
    - navigation.footer
plugins:
  - search
  - redirects:
      redirect_maps:
        'index.md': 'getting-started.md'
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            members_order: source
            merge_init_into_class: true
            show_root_heading: true
            show_root_full_path: true
            show_source: false
            filters: public
            docstring_options:
              warn_unknown_params: false
              warn_missing_types: false

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - tables
  - attr_list
  - md_in_html

extra_css:
  - styles/overrides.css
  - styles/extra.css
nav:
  - Getting started: getting-started.md
  - User guide:
      - Pipelines and tasks: pipeline.md
      - Settings: settings.md
      - Plug-in points: plugins.md
      - Staged workflow: workflow.md
      - Restraints: restraints.md
      - Active-bond windows: active-bonds.md
      - Swaps: swap.md
      - CLI: cli.md
  - Components:
      - Modules overview: modules/README.md
      - Molecule builders: modules/mol_getter.md
      - Embedders: modules/embedder.md
      - Optimizers: modules/ff_optimizer.md
      - Pruners: modules/pruner.md
  - API reference:
      - racerts.api: api/api.md
      - racerts.config: api/config.md
      - racerts.task: api/task.md
      - racerts.pipeline: api/pipeline.md
      - racerts.embed: api/embed.md
      - racerts.refine: api/refine.md
      - racerts.prune: api/prune.md
      - racerts.restraints: api/restraints.md
      - racerts.system: api/system.md
      - racerts.system.swap: api/system_swap.md
      - racerts.validate: api/validate.md
      - racerts.exploit: api/exploit.md
      - racerts.metadynamics: api/metadynamics.md
      - racerts.recombine: api/recombine.md
      - racerts.polish: api/polish.md
      - racerts.interfaces: api/interfaces.md
      - racerts.recipes: api/recipes.md
      - racerts.io: api/io.md
      - racerts.errors: api/errors.md
      - racerts.rmsd: api/rmsd.md
  - Legacy racerts:
      - Migrating from legacy racerts: migration.md
      - conformer_generator: modules/conformer_generator.md

site_url: "https://digital-chemistry-laboratory.github.io/racerTS/"
