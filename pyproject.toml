[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "racerts"
version = "0.1.7"
authors = [
    { name = "Stefan P. Schmid", email = "stefan.schmid@chem.ethz.ch" },
    { name = "Henrik Seng" ,email = "heseng@ethz.ch" },
    { name = "Thibault Kläy", email = "thibault.klay@epfl.ch" },
    { name = "Kjell Jorner", email = "kjell.jorner@chem.ethz.ch" },
]
description = "Rapid Conformer Ensemble with RDKit for Transition States"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "rdkit>=2023.9.6",
    "numpy>=1.26.4",
    "attrs>=21.3.0",
    "ipython>=7.34.0",
    "py3Dmol>=2.0.0",
]
license = "MIT"
license-files = ["LICENSE*"]

[project.urls]
Homepage = "https://github.com/digital-chemistry-laboratory/racerts/"
Documentation = "https://digital-chemistry-laboratory.github.io/racerts/"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["racerts*"]

[project.optional-dependencies]
ase = [
    "ase>=3.22.0",
    "threadpoolctl>=3.0.0",
]
yaml = [
    "pyyaml>=6.0",
]
dev = [
    "pytest>=7.0",
    "pyyaml>=6.0",
    "ruff>=0.5.0",
]
[project.scripts]
racerts = "racerts.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m \"not ase\""
markers = [
    "ase: tests requiring optional ASE dependency",
]

[tool.ruff]
line-length = 88
target-version = "py310"
extend-exclude = ["tests/data"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "W"]

[tool.ruff.lint.isort]
known-first-party = ["racerts"]
